services:
  # Single Web Service - Dashboard + Stream Processor
  - type: web
    name: companies-house-dashboard
    env: docker
    region: frankfurt
    plan: standard-256mb
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: API_KEY
        sync: false
      - key: SSE_URL
        value: https://stream.companieshouse.gov.uk/
      - key: DATABASE_FILE
        value: /data/companies.db
      - key: PORT
        value: 8000
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: dashboard-data
      mountPath: /data
      sizeGB: 1
